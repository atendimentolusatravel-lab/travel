<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão Documental</title>
<meta name="description" content="Controle de pastas, documentos, validades e prazos de guarda por setor, adaptável a qualquer empresa.">
<style>
:root{
  --gold:#da8d00;--gold-lo:rgba(218,141,0,.13);--gold-hi:#f0a010;
  --bg:#f5f0ea;--sf:#fbf8f4;--sf2:#ede7de;--bd:#d9cfc1;
  --t:#1a1510;--t2:#5c5249;--t3:#8f8274;
  --sb:#0f0d0b;--sb-bd:#252018;--sb-t:#8a7e74;--sb-hi:#f0e8de;
  --ok:#2f6b3c;--ok-lo:rgba(47,107,60,.12);
  --warn:#b07000;--warn-lo:rgba(218,141,0,.16);
  --bad:#a32020;--bad-lo:rgba(163,32,32,.11);
  --neu:#8f8274;--neu-lo:rgba(143,130,116,.14);
  --sans:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:ui-monospace,'Cascadia Mono','Courier New',monospace;
  --r:6px;--sbw:248px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141108;--sf:#1c1811;--sf2:#27211a;--bd:#3a3122;
  --t:#f0e8de;--t2:#b3a490;--t3:#7d6f60;
  --gold:#e8a210;--gold-lo:rgba(232,162,16,.13);--gold-hi:#ffb830;
  --ok:#6fbf7f;--ok-lo:rgba(111,191,127,.13);
  --warn:#f0b030;--warn-lo:rgba(240,176,48,.14);
  --bad:#ef7a6e;--bad-lo:rgba(239,122,110,.13);
  --neu:#9a8d80;--neu-lo:rgba(154,141,128,.14);
}}
:root[data-theme="dark"]{
  --bg:#141108;--sf:#1c1811;--sf2:#27211a;--bd:#3a3122;
  --t:#f0e8de;--t2:#b3a490;--t3:#7d6f60;
  --gold:#e8a210;--gold-lo:rgba(232,162,16,.13);--gold-hi:#ffb830;
  --ok:#6fbf7f;--ok-lo:rgba(111,191,127,.13);
  --warn:#f0b030;--warn-lo:rgba(240,176,48,.14);
  --bad:#ef7a6e;--bad-lo:rgba(239,122,110,.13);
  --neu:#9a8d80;--neu-lo:rgba(154,141,128,.14);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--t);font-family:var(--sans);font-size:14.5px;line-height:1.55;min-height:100vh}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
.hide{display:none!important}

/* SIDEBAR */
.sb{position:fixed;inset:0 auto 0 0;width:var(--sbw);background:var(--sb);border-right:1px solid var(--sb-bd);display:flex;flex-direction:column;z-index:50;overflow-y:auto}
.sb-brand{padding:22px 20px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--sb-bd)}
.sb-mark{width:34px;height:34px;border:2px solid var(--gold);border-radius:6px;display:grid;place-items:center;font-size:10px;font-weight:800;color:var(--gold);letter-spacing:.05em;flex-shrink:0}
.sb-n{font-size:13px;font-weight:700;color:var(--sb-hi);line-height:1.2}
.sb-d{font-size:10.5px;color:var(--sb-t);margin-top:2px}
.sb-search{margin:14px 14px 4px;position:relative}
.sb-search input{width:100%;background:#1a1612;border:1px solid var(--sb-bd);border-radius:var(--r);padding:8px 10px 8px 30px;font-size:12.5px;color:var(--sb-hi)}
.sb-search input::placeholder{color:#6d6259}
.sb-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:13px;height:13px;stroke:#6d6259}
.sb-lbl{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;padding:16px 22px 6px}
.sb-nav{display:flex;flex-direction:column;padding:0 10px;gap:1px}
.sb-a{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:var(--r);text-decoration:none;color:var(--sb-t);font-size:12.5px;font-weight:500;transition:background .12s,color .12s}
.sb-a:hover{background:rgba(255,255,255,.05);color:var(--sb-hi)}
.sb-a.on{background:rgba(218,141,0,.14);color:var(--gold)}
.sb-num{font-size:10px;font-family:var(--mono);opacity:.5;width:18px;flex-shrink:0}
.sb-txt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sb-pill{font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px}
.sb-pill.bad{background:rgba(239,122,110,.18);color:#ef7a6e}
.sb-pill.warn{background:rgba(240,176,48,.16);color:#f0b030}
.sb-pill.ok{color:#6fbf7f}
.sb-foot{margin-top:auto;padding:14px 16px 18px;border-top:1px solid var(--sb-bd);display:flex;flex-direction:column;gap:6px}
.sb-foot small{font-size:10.5px;color:var(--sb-t);line-height:1.45}
.sb-btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sb-btn{background:#1a1612;border:1px solid var(--sb-bd);color:var(--sb-hi);border-radius:var(--r);padding:6px 8px;font-size:11.5px;cursor:pointer}
.sb-btn:hover{border-color:var(--gold);color:var(--gold)}

/* TOPBAR (mobile) */
.top{display:none;position:sticky;top:0;z-index:40;background:var(--sb);color:var(--sb-hi);padding:10px 16px;align-items:center;gap:12px;border-bottom:2px solid var(--gold)}
.top button{background:none;border:0;color:var(--sb-hi);cursor:pointer;display:grid;place-items:center;width:32px;height:32px}
.top b{font-size:13.5px}
.scrim{display:none}

/* MAIN */
.main{margin-left:var(--sbw);min-width:0}
.wrap{max-width:1160px;padding:44px 48px 80px}
.eyebrow{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:700;margin-bottom:8px}
h1{font-size:clamp(22px,3.2vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.15;margin-bottom:10px;text-wrap:balance}
.intro{font-size:14px;color:var(--t2);max-width:680px;margin-bottom:26px}
.goldbar{height:3px;background:linear-gradient(90deg,var(--gold),transparent);margin:0 0 28px;border-radius:2px}
h2{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--t3);font-weight:700;margin:34px 0 14px;display:flex;align-items:center;gap:10px}
h2::after{content:'';flex:1;height:1px;background:var(--bd)}
.meta{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:12.5px;color:var(--t2);margin-bottom:6px}
.meta b{color:var(--t);font-weight:600}
code,.path{font-family:var(--mono);font-size:11.5px;background:var(--sf2);padding:1px 6px;border-radius:4px;color:var(--t2);word-break:break-all}

/* KPI */
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.kpi{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px;cursor:pointer;text-align:left;transition:border-color .12s}
.kpi:hover{border-color:var(--gold)}
.kpi .v{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:11.5px;color:var(--t2);margin-top:4px}
.kpi.hero{background:var(--sb);border-color:var(--sb);color:var(--sb-hi)}
.kpi.hero .v{color:var(--gold)}
.kpi.hero .l{color:var(--sb-t)}
.kpi .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}

/* BADGES */
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 9px;border-radius:20px;white-space:nowrap}
.badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor}
.s-ok{background:var(--ok-lo);color:var(--ok)}
.s-alerta{background:var(--warn-lo);color:var(--warn)}
.s-vencido{background:var(--bad-lo);color:var(--bad)}
.s-pendente{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.s-opcional,.s-na{background:var(--neu-lo);color:var(--neu)}
.acc{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:2px 7px;border-radius:4px;border:1px solid var(--bd);color:var(--t2)}
.acc.confidencial{border-color:var(--bad);color:var(--bad)}
.acc.restrito{border-color:var(--gold);color:var(--warn)}
.req{color:var(--gold);font-weight:700}

/* LIST */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.chip{background:var(--sf);border:1px solid var(--bd);border-radius:20px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--t2)}
.chip.on{background:var(--t);border-color:var(--t);color:var(--bg)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}
.grow{flex:1}
.btn{background:var(--gold);color:#1a1510;border:0;border-radius:var(--r);padding:8px 14px;font-size:12.5px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--gold-hi)}
.btn.ghost{background:transparent;color:var(--t);box-shadow:inset 0 0 0 1px var(--bd);font-weight:600}
.btn.ghost:hover{box-shadow:inset 0 0 0 1px var(--gold);color:var(--gold)}
.btn.danger{background:transparent;color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}
.list{border:1px solid var(--bd);border-radius:var(--r);background:var(--sf);overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) 120px 110px 130px 128px 34px;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--bd);cursor:pointer;transition:background .1s}
.row:first-child{border-top:0}
.row:hover{background:var(--gold-lo)}
.row.head{cursor:default;background:var(--sf2);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);font-weight:700;padding:9px 16px}
.row.head:hover{background:var(--sf2)}
.d-name{font-weight:600;font-size:13.5px;line-height:1.35}
.d-sub{font-size:11.5px;color:var(--t3);margin-top:3px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.cell{font-size:12.5px;color:var(--t2);font-variant-numeric:tabular-nums}
.cell .lbl{display:none}
.lk{width:30px;height:30px;border-radius:var(--r);display:grid;place-items:center;color:var(--t3)}
.lk.has{color:var(--gold)}
.lk:hover{background:var(--sf2)}
.lk svg{width:15px;height:15px}
.empty{padding:28px;text-align:center;color:var(--t3);font-size:13px}

/* SECTOR TABLE */
.sect{display:grid;grid-template-columns:minmax(0,1fr) 180px 64px 64px 64px;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--bd);cursor:pointer;text-decoration:none;color:inherit}
.sect:first-child{border-top:0}
.sect:hover{background:var(--gold-lo)}
.sect.head{background:var(--sf2);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);font-weight:700;cursor:default;padding:9px 16px}
.sect .num{text-align:right;font-variant-numeric:tabular-nums;font-size:13px}
.bar{height:6px;border-radius:3px;background:var(--sf2);overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.pct{display:flex;align-items:center;gap:8px;font-size:12px;font-variant-numeric:tabular-nums;color:var(--t2)}
.pct span{width:36px;text-align:right}

/* CARDS / SUBFOLDERS */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);padding:14px 16px}
.card h3{font-size:13.5px;font-weight:700;margin-bottom:4px}
.card p{font-size:12.5px;color:var(--t2)}
.callout{border-radius:var(--r);padding:13px 16px;font-size:13px;color:var(--t2);background:var(--gold-lo);border-left:3px solid var(--gold);margin:14px 0}
.callout b{color:var(--t)}
.callout.bad{background:var(--bad-lo);border-left-color:var(--bad)}
details.fold{border:1px solid var(--bd);border-radius:var(--r);background:var(--sf);margin-bottom:8px}
details.fold>summary{cursor:pointer;padding:11px 16px;font-weight:600;font-size:13.5px;list-style:none;display:flex;gap:10px;align-items:center}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:'▸';color:var(--gold);transition:transform .15s}
details.fold[open]>summary::before{transform:rotate(90deg)}
.tree{font-family:var(--mono);font-size:12px;line-height:1.75;padding:4px 16px 14px 34px;color:var(--t2);white-space:pre;overflow-x:auto}
.tree b{color:var(--t);font-weight:600}
.tree i{color:var(--t3);font-style:normal}

/* FORMS */
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 14px;align-items:end}
.fgrid .full{grid-column:1/-1}
label.f{display:flex;flex-direction:column;gap:5px;font-size:11.5px;font-weight:600;color:var(--t2)}
label.f input,label.f select,label.f textarea{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r);padding:8px 10px;font-size:13.5px;font-weight:400;color:var(--t);width:100%}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--gold);outline-offset:-1px;border-color:var(--gold)}
label.f .hint{font-weight:400;color:var(--t3);font-size:11px}
label.chk{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--t2);cursor:pointer}
label.chk input{accent-color:var(--gold);width:16px;height:16px}
.out{display:flex;gap:8px;align-items:center;background:var(--sb);color:var(--gold);border-radius:var(--r);padding:12px 14px;font-family:var(--mono);font-size:13px;margin-top:12px;word-break:break-all}
.out span{flex:1}
.out button{background:transparent;border:1px solid var(--sb-bd);color:var(--sb-hi);border-radius:4px;padding:4px 10px;font-size:11.5px;cursor:pointer;font-family:var(--sans);flex-shrink:0}
.out button:hover{border-color:var(--gold);color:var(--gold)}

/* TABLE (manual) */
table.t{width:100%;border-collapse:collapse;font-size:12.5px;background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden}
table.t th{background:var(--sf2);text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--t3);padding:9px 12px}
table.t td{padding:9px 12px;border-top:1px solid var(--bd);color:var(--t2);vertical-align:top}
table.t td:first-child{color:var(--t);font-weight:600}
.tscroll{overflow-x:auto}
ol.rules,ul.rules{padding-left:20px;font-size:13.5px;color:var(--t2);display:flex;flex-direction:column;gap:7px;max-width:760px}
ol.rules b,ul.rules b{color:var(--t)}

/* DIALOG */
dialog{border:0;border-radius:10px;background:var(--sf);color:var(--t);width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 24px);padding:0;box-shadow:0 24px 60px rgba(0,0,0,.35);margin:auto}
dialog::backdrop{background:rgba(15,13,11,.6)}
.dlg-h{padding:18px 22px 14px;border-bottom:3px solid var(--gold);background:var(--sb);color:var(--sb-hi)}
.dlg-h .eyebrow{margin-bottom:4px}
.dlg-h h3{font-size:16px;line-height:1.3}
.dlg-b{padding:18px 22px;overflow-y:auto}
.dlg-info{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:12.5px;color:var(--t2);margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--bd)}
.dlg-info dt{color:var(--t3);font-weight:600}
.dlg-f{padding:14px 22px;border-top:1px solid var(--bd);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(30px);background:var(--sb);color:var(--sb-hi);border:1px solid var(--gold);padding:10px 16px;border-radius:var(--r);font-size:13px;opacity:0;transition:.2s;z-index:100;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1;transform:translateX(-50%)}

@media (max-width:1080px){
  .kpis{grid-template-columns:repeat(3,minmax(0,1fr))}
  .row{grid-template-columns:minmax(0,1fr) 110px 128px 34px}
  .row .c-val,.row .c-resp{display:none}
}
@media (max-width:820px){
  .sb{transform:translateX(-100%);transition:transform .2s}
  body.nav-open .sb{transform:none}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:45}
  .top{display:flex}
  .main{margin-left:0}
  .wrap{padding:24px 16px 64px}
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .kpi.hero{grid-column:1/-1}
  .row.head,.sect.head{display:none}
  .row{grid-template-columns:minmax(0,1fr) 34px;gap:6px 10px;padding:12px 14px}
  .row .c-main{grid-column:1/2}
  .row .c-lk{grid-column:2;grid-row:1}
  .row .c-ven,.row .c-st{grid-column:1/-1;display:flex}
  .row .c-ven .lbl{display:inline;color:var(--t3);margin-right:6px}
  .sect{grid-template-columns:minmax(0,1fr) 54px 54px;row-gap:6px}
  .sect .pct{grid-column:1/-1;grid-row:2}
  .sect .c-docs{display:none}
  .grid2,.fgrid{grid-template-columns:1fr}
}
/* PERFIL */
.opts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.opts.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt span{display:block;border:1px solid var(--bd);border-radius:var(--r);padding:10px 12px;font-size:13px;font-weight:600;background:var(--bg);transition:border-color .12s,background .12s}
.opt small{display:block;font-weight:400;color:var(--t3);font-size:11px;margin-top:2px}
.opt input:checked+span{border-color:var(--gold);background:var(--gold-lo);box-shadow:inset 0 0 0 1px var(--gold)}
.opt input:focus-visible+span{outline:2px solid var(--gold);outline-offset:2px}
.setlist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
.setlist label.chk{padding:6px 0;border-bottom:1px solid var(--bd)}
.setlist label.chk em{font-style:normal;font-size:10.5px;color:var(--t3);margin-left:auto}
.setlist label.chk input:disabled{opacity:.6}
.resumo{display:flex;flex-wrap:wrap;gap:8px 22px;background:var(--sb);color:var(--sb-hi);border-radius:var(--r);padding:14px 18px;font-size:13px;margin-top:18px;border-bottom:3px solid var(--gold)}
.resumo b{color:var(--gold);font-size:18px;margin-right:4px;font-variant-numeric:tabular-nums}
.tag{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
@media (max-width:820px){.opts,.opts.three,.setlist{grid-template-columns:1fr 1fr}}
@media (max-width:420px){.opts,.opts.three,.setlist{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="top">
  <button id="menu" aria-label="Abrir menu"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
  <b>Gestão Documental</b>
</header>
<div class="scrim" id="scrim"></div>

<aside class="sb" id="sb">
  <div class="sb-brand">
    <div class="sb-mark" id="sb-mark">GD</div>
    <div><div class="sb-n" id="sb-nome">Empresa</div><div class="sb-d">Gestão Documental</div></div>
  </div>
  <div class="sb-search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Buscar documento…" autocomplete="off">
  </div>
  <div class="sb-lbl">Controle</div>
  <nav class="sb-nav" id="nav-top"></nav>
  <div class="sb-lbl">Setores</div>
  <nav class="sb-nav" id="nav-set"></nav>
  <div class="sb-lbl">Referência</div>
  <nav class="sb-nav" id="nav-ref"></nav>
  <div class="sb-foot">
    <small id="saved">Os dados ficam salvos neste navegador.</small>
    <div class="sb-btns">
      <button class="sb-btn" data-act="backup">Backup</button>
      <button class="sb-btn" data-act="restore">Restaurar</button>
      <button class="sb-btn" data-act="csv">Planilha CSV</button>
      <button class="sb-btn" data-act="zip">Pastas .zip</button>
    </div>
    <input type="file" id="file" accept="application/json,.json" class="hide">
  </div>
</aside>

<main class="main"><div class="wrap" id="view"></div></main>

<dialog id="dlg"><form method="dialog" id="dlg-form"></form></dialog>

<script>

"subpasta":"02_Licencas_e_Assinaturas","obrigatorio":false,"validade_dias":365,"temporalidade":"Vigência + 5 anos","acesso":"restrito","nota":"Software sem licença gera multa e indenização (Lei 9.609/1998)."},{"id":"ti-03","nome":"Matriz de acessos por cargo (revisão semestral)","subpasta":"03_Controle_de_Acessos","obrigatorio":false,"validade_dias":180,"temporalidade":"Versões + 5 anos","acesso":"restrito","nota":"Na saída de um colaborador, revogue os acessos no mesmo dia."},{"id":"ti-04","nome":"Política de backup e registro de teste de restauração","subpasta":"04_Backup_e_Continuidade","obrigatorio":true,"validade_dias":90,"temporalidade":"2 anos","acesso":"restrito","nota":"Backup que nunca foi testado não serve como backup. XMLs fiscais e escrituração devem estar no backup."},{"id":"ti-05","nome":"Contratos dos sistemas (ERP, emissor de NF, folha)","subpasta":"05_Contratos_de_Sistemas","obrigatorio":false,"validade_dias":null,"temporalidade":"Vigência + 5 anos","acesso":"restrito","nota":"Garanta no contrato a exportação dos dados (XML, SPED) ao trocar de sistema."}]},{"codigo":"99","pasta":"99_ARQUIVO_MORTO","nome":"Arquivo Morto","responsavel":"Administrativo","acesso":"restrito","fixo":true,"descricao":"Documentos encerrados que ainda estão no prazo de guarda, organizados por AAAA/SETOR. Nada é eliminado sem termo aprovado pela Diretoria.","subpastas":[{"pasta":"01_Termos_de_Eliminacao","descricao":"Registro do que foi eliminado, quando, por quem e com qual autorização."},{"pasta":"02_Documentos_Encerrados","descricao":"Por ano e, dentro do ano, pelo código do setor de origem.","periodo":"anual"}],"documentos":[{"id":"arq-01","nome":"Termos de eliminação de documentos","subpasta":"01_Termos_de_Eliminacao","obrigatorio":true,"validade_dias":null,"temporalidade":"Permanente","acesso":"restrito"},{"id":"arq-02","nome":"Revisão anual da temporalidade (o que pode ser eliminado)","subpasta":"01_Termos_de_Eliminacao","obrigatorio":true,"validade_dias":365,"temporalidade":"Permanente","acesso":"restrito"}]}]}/*ESTRUTURA_FIM*/;
const KEY = 'gestao-documental.v2';
const ALERTA_DIAS = 30;

/* ---------- estado ---------- */
function vazio(){ return { perfil:null, docs:{}, extras:[], atualizado:null }; }
function carregar(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.docs) return Object.assign(vazio(), s); } catch(e){}
  return vazio();
}
let S = carregar();
function salvar(){
  S.atualizado = new Date().toISOString();
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('Não foi possível salvar neste navegador. Exporte um backup agora.'); }
  rodapeSalvo();
}
function perfil(){ return Object.assign({}, E.perfil_padrao, S.perfil || {}); }

/* ---------- utilidades ---------- */
const $ = s => document.querySelector(s);
const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoje = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const parse = s => { if(!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const fmt = d => d ? `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}` : '—';
const addDias = (d,n) => { const x = new Date(d); x.setDate(x.getDate()+n); return x; };
const diasAte = d => Math.round((d - hoje()) / 86400000);
const linkSeguro = u => /^https?:\/\//i.test(u||'') ? u : '';
const setorPorCodigo = c => E.setores.find(s => s.codigo === c);
const semAcento = s => String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'');
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600); }
function copiar(txt){ (navigator.clipboard?.writeText(txt) || Promise.reject()).then(()=>toast('Copiado.'),()=>toast('Selecione e copie manualmente.')); }
function validadeTxt(v){
  if(!v) return 'Sem vencimento';
  if(v===30) return 'Mensal';
  if(v%365===0){ const n=v/365; return n===1?'Anual':`A cada ${n} anos`; }
  return `A cada ${v} dias`;
}

/* ---------- perfil: mesma lógica de gestao-documental/gerar.py ---------- */
function aplica(item, P){
  const se = item.se || {};
  if (se.regime && !se.regime.includes(P.regime)) return false;
  if (se.atividades && !se.atividades.some(a => P.atividades.includes(a))) return false;
  if ('empregados' in se && !!P.empregados !== se.empregados) return false;
  return true;
}
const setorAtivo = (s, P) => !!s.fixo || !P.setores_inativos.includes(s.codigo);
function slugRaiz(nome){
  const x = semAcento(nome).replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').toUpperCase();
  return (x || 'EMPRESA') + '_DOCUMENTOS';
}
function setoresAtivos(P=perfil()){ return E.setores.filter(s => setorAtivo(s, P)); }
function subpastas(s, P=perfil()){ return s.subpastas.filter(p => aplica(p, P)); }

/* ---------- documentos ---------- */
function todosDocs(P=perfil()){
  const out = [];
  for (const s of setoresAtivos(P)) for (const d of s.documentos) if (aplica(d, P)) out.push({...d, setor:s, extra:false});
  for (const x of S.extras){ const s = setorPorCodigo(x.setor); if (s && setorAtivo(s, P)) out.push({...x, setor:s, extra:true}); }
  return out;
}
function estado(d){ return S.docs[d.id] || {}; }
function vencimento(d){
  const st = estado(d);
  if (st.vencimento) return parse(st.vencimento);
  if (st.emissao && d.validade_dias) return addDias(parse(st.emissao), d.validade_dias);
  return null;
}
function status(d){
  const st = estado(d);
  if (st.na) return {k:'na', t:'Não se aplica', o:6};
  const tem = st.emissao || st.vencimento || st.link;
  if (!tem) return d.obrigatorio ? {k:'pendente', t:'Pendente', o:1} : {k:'opcional', t:'Não cadastrado', o:5};
  const v = vencimento(d);
  if (v){
    const n = diasAte(v);
    if (n < 0) return {k:'vencido', t:`Vencido há ${-n}d`, o:0};
    if (n <= ALERTA_DIAS) return {k:'alerta', t: n===0?'Vence hoje':`Vence em ${n}d`, o:2};
  }
  return {k:'ok', t:'Em dia', o:4};
}
function resumo(docs){
  const r = {total:docs.length, ok:0, alerta:0, vencido:0, pendente:0, opcional:0, na:0, obrig:0, obrigOk:0};
  for (const d of docs){
    const s = status(d).k; r[s]++;
    if (d.obrigatorio && s!=='na'){ r.obrig++; if (s==='ok'||s==='alerta') r.obrigOk++; }
  }
  r.conf = r.obrig ? Math.round(100*r.obrigOk/r.obrig) : 100;
  r.acao = r.vencido + r.pendente + r.alerta;
  return r;
}

/* ---------- navegação ---------- */
const TOP = [{h:'painel', n:'◆', t:'Painel geral'}, {h:'acao', n:'!', t:'Ação necessária'}, {h:'perfil', n:'⚙', t:'Perfil da empresa'}];
const REF = [{h:'estrutura', n:'▤', t:'Estrutura de pastas'}, {h:'nomenclatura', n:'Aa', t:'Nomenclatura'}, {h:'manual', n:'§', t:'Manual e rotinas'}];
function navLink(h, n, t, pill=''){ return `<a class="sb-a" href="#${h}" data-h="${h}"><span class="sb-num">${n}</span><span class="sb-txt">${esc(t)}</span>${pill}</a>`; }
function renderNav(){
  const P = perfil(), todos = todosDocs(P), r = resumo(todos);
  $('#sb-nome').textContent = P.nome || 'Empresa';
  $('#sb-mark').textContent = (semAcento(P.nome).replace(/[^A-Za-z0-9 ]/g,'').split(/\s+/).filter(Boolean).map(w=>w[0]).join('').slice(0,2).toUpperCase()) || 'GD';
  $('#nav-top').innerHTML = TOP.map(x => navLink(x.h, x.n, x.t, x.h==='acao' && r.acao ? `<span class="sb-pill ${r.vencido+r.pendente?'bad':'warn'}">${r.acao}</span>`:'')).join('');
  $('#nav-set').innerHTML = setoresAtivos(P).map(s => {
    const rs = resumo(todos.filter(d => d.setor===s)), crit = rs.vencido + rs.pendente;
    const pill = crit ? `<span class="sb-pill bad">${crit}</span>` : rs.alerta ? `<span class="sb-pill warn">${rs.alerta}</span>` : rs.total ? `<span class="sb-pill ok">✓</span>` : '';
    return navLink('setor-'+s.codigo, s.codigo, s.nome, pill);
  }).join('');
  $('#nav-ref').innerHTML = REF.map(x => navLink(x.h, x.n, x.t)).join('');
  const h = rota().h;
  document.querySelectorAll('.sb-a').forEach(a => a.classList.toggle('on', a.dataset.h === h));
}
function rota(){
  const raw = decodeURIComponent(location.hash.slice(1)) || 'painel';
  const [h, q] = raw.split('?');
  return {h, q: new URLSearchParams(q||'')};
}
let filtro = 'todos';
function render(){
  const {h, q} = rota();
  const v = $('#view');
  document.title = `Gestão Documental — ${perfil().nome || 'Empresa'}`;
  if (h.startsWith('setor-')){ const s = setorPorCodigo(h.slice(6)); v.innerHTML = s && setorAtivo(s, perfil()) ? viewSetor(s) : viewPainel(); }
  else if (h==='acao') v.innerHTML = viewAcao();
  else if (h==='perfil'){ v.innerHTML = viewPerfil(); atualizarResumoPerfil(); }
  else if (h==='busca') v.innerHTML = viewBusca(q.get('q')||'');
  else if (h==='estrutura') v.innerHTML = viewEstrutura();
  else if (h==='nomenclatura'){ v.innerHTML = viewNomenclatura(); atualizarGeradores(); }
  else if (h==='manual') v.innerHTML = viewManual();
  else v.innerHTML = viewPainel();
  renderNav();
  document.body.classList.remove('nav-open');
}
addEventListener('hashchange', () => { filtro='todos'; render(); window.scrollTo(0,0); });

/* ---------- componentes ---------- */
const ICON_LINK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></svg>';
function badge(d){ const s=status(d); return `<span class="badge s-${s.k}">${esc(s.t)}</span>`; }
function acc(k){ return `<span class="acc ${k}">${esc(E.niveis_acesso[k]?.rotulo||k)}</span>`; }
function linhaDoc(d, mostrarSetor){
  const st = estado(d), v = vencimento(d), lk = linkSeguro(st.link);
  return `<div class="row" data-edit="${esc(d.id)}" tabindex="0" role="button" aria-label="Editar ${esc(d.nome)}">
    <div class="c-main"><div class="d-name">${d.obrigatorio?'<span class="req" title="Obrigatório">*</span> ':''}${esc(d.nome)}</div>
      <div class="d-sub">${mostrarSetor?`<span>${esc(d.setor.codigo)} · ${esc(d.setor.nome)}</span>`:''}<span class="path">${esc(d.subpasta)}</span>${d.acesso!=='interno'?acc(d.acesso):''}</div></div>
    <div class="cell c-val">${esc(validadeTxt(d.validade_dias))}</div>
    <div class="cell c-ven"><span class="lbl">Vencimento</span>${fmt(v)}</div>
    <div class="cell c-resp">${esc(st.responsavel||'—')}</div>
    <div class="c-st">${badge(d)}</div>
    <div class="c-lk">${lk?`<a class="lk has" href="${esc(lk)}" target="_blank" rel="noopener" title="Abrir arquivo" data-stop>${ICON_LINK}</a>`:`<span class="lk" title="Sem link">${ICON_LINK}</span>`}</div>
  </div>`;
}
function lista(docs, mostrarSetor){
  if (!docs.length) return `<div class="list"><div class="empty">Nenhum documento neste filtro.</div></div>`;
  docs = [...docs].sort((a,b) => status(a).o - status(b).o || (vencimento(a)||Infinity) - (vencimento(b)||Infinity));
  return `<div class="list"><div class="row head"><div>Documento</div><div class="c-val">Validade</div><div class="c-ven">Vencimento</div><div class="c-resp">Responsável</div><div class="c-st">Status</div><div class="c-lk"></div></div>${docs.map(d=>linhaDoc(d,mostrarSetor)).join('')}</div>`;
}
const FILTROS = [['todos','Todos'],['acao','Ação necessária'],['ok','Em dia'],['obrig','Obrigatórios'],['opcional','Não cadastrados'],['na','Não se aplica']];
function aplicaFiltro(docs, f=filtro){
  return docs.filter(d => {
    const k = status(d).k;
    if (f==='acao') return ['vencido','pendente','alerta'].includes(k);
    if (f==='ok') return k==='ok';
    if (f==='obrig') return d.obrigatorio;
    if (f==='opcional') return k==='opcional';
    if (f==='na') return k==='na';
    return true;
  });
}
function chips(docs){ return FILTROS.map(([k,t]) => `<button class="chip ${filtro===k?'on':''}" data-filtro="${k}">${t}<span class="n">${aplicaFiltro(docs,k).length}</span></button>`).join(''); }
function descPerfil(P){
  const op = E.opcoes_perfil;
  return `${op.regime[P.regime]} · ${P.atividades.map(a=>op.atividades[a]).join(', ')||'sem atividade'} · ${P.empregados?'com empregados':'sem empregados'}`;
}

/* ---------- views ---------- */
function viewPainel(){
  const P = perfil(), todos = todosDocs(P), r = resumo(todos);
  const prox = todos.filter(d => { const v=vencimento(d); return v && status(d).k!=='na' && diasAte(v) <= 60; })
    .sort((a,b)=>vencimento(a)-vencimento(b)).slice(0,8);
  return `
  <div class="eyebrow">Gestão documental · ${esc(P.nome)}</div>
  <h1>Painel geral</h1>
  <p class="intro">${setoresAtivos(P).length} setores e ${todos.length} documentos controlados para o perfil <b>${esc(descPerfil(P))}</b>. Clique em qualquer documento para registrar a emissão, o vencimento, o responsável e o link do arquivo.</p>
  <div class="goldbar"></div>
  ${!S.perfil ? `<div class="callout"><b>Primeiro passo:</b> configure o <a href="#perfil">perfil da empresa</a> (nome, regime tributário, atividades, empregados e setores). A estrutura de pastas e a lista de documentos se ajustam a ele.</div>`:''}
  <div class="kpis">
    <button class="kpi hero" data-go="acao"><div class="v">${r.conf}%</div><div class="l">Conformidade dos obrigatórios (${r.obrigOk} de ${r.obrig})</div></button>
    <button class="kpi" data-go="acao"><div class="v" style="color:var(--bad)">${r.vencido}</div><div class="l"><span class="dot" style="background:var(--bad)"></span>Vencidos</div></button>
    <button class="kpi" data-go="acao"><div class="v" style="color:var(--bad)">${r.pendente}</div><div class="l"><span class="dot" style="box-shadow:inset 0 0 0 1.5px var(--bad)"></span>Obrigatórios pendentes</div></button>
    <button class="kpi" data-go="acao"><div class="v" style="color:var(--warn)">${r.alerta}</div><div class="l"><span class="dot" style="background:var(--warn)"></span>Vencem em ${ALERTA_DIAS} dias</div></button>
    <button class="kpi" data-go="busca"><div class="v" style="color:var(--ok)">${r.ok}</div><div class="l"><span class="dot" style="background:var(--ok)"></span>Em dia</div></button>
  </div>
  <h2>Próximos vencimentos (60 dias)</h2>
  ${prox.length ? lista(prox, true) : `<div class="list"><div class="empty">Nenhum vencimento nos próximos 60 dias${S.atualizado?'':'. Cadastre as datas para ativar os alertas'}.</div></div>`}
  <h2>Situação por setor</h2>
  <div class="list">
    <div class="sect head"><div>Setor</div><div>Conformidade</div><div class="num c-docs">Docs</div><div class="num">Ação</div><div class="num">Em dia</div></div>

function slug(s, upper){

}

    <button type="button" class="btn ghost" data-fechar>Cancelar</button>
    <button type="submit" class="btn">Salvar</button>
  </div>`;
  dform.onsubmit = ev => {
    ev.preventDefault();
    const fd = new FormData(dform), o = {};
    for (const k of ['emissao','vencimento','responsavel','link','obs']){ const v = String(fd.get(k)||'').trim(); if (v) o[k]=v; }
    if (o.link && !linkSeguro(o.link)) { toast('O link deve começar com http:// ou https://'); return; }
    if (fd.get('na')) o.na = true;
    if (Object.keys(o).length) S.docs[d.id] = o; else delete S.docs[d.id];
    salvar(); dlg.close(); render(); toast('Documento atualizado.');
  };
  dlg.showModal();
}
function abrirNovo(codigo){
  const s = setorPorCodigo(codigo);
  dform.innerHTML = `
  <div class="dlg-h"><div class="eyebrow">${esc(s.codigo)} · ${esc(s.nome)}</div><h3>Novo documento controlado</h3></div>
  <div class="dlg-b"><div class="fgrid">
    <label class="f full">Nome do documento<input name="nome" required placeholder="ex.: Contrato com o fornecedor X"></label>
    <label class="f full">Subpasta<select name="subpasta">${subpastas(s).map(p=>`<option>${esc(p.pasta)}</option>`).join('')}</select></label>
    <label class="f">Validade<select name="validade"><option value="">Sem vencimento</option><option value="30">Mensal (30 dias)</option><option value="90">90 dias</option><option value="180">180 dias</option><option value="365" selected>Anual</option><option value="730">2 anos</option></select></label>
    <label class="f">Acesso<select name="acesso">${Object.entries(E.niveis_acesso).map(([k,n])=>`<option value="${k}" ${k===s.acesso?'selected':''}>${n.rotulo}</option>`).join('')}</select></label>
    <label class="f full">Prazo de guarda<input name="temporalidade" value="Vigência + 5 anos"></label>
    <label class="chk full"><input type="checkbox" name="obrigatorio" checked> Obrigatório</label>
  </div>
  <p class="intro" style="margin:14px 0 0;font-size:12px">Documentos adicionados aqui ficam só neste navegador (e no backup). Para torná-los padrão no modelo, inclua-os em <code>gestao-documental/estrutura.json</code>.</p></div>
  <div class="dlg-f"><span class="grow"></span><button type="button" class="btn ghost" data-fechar>Cancelar</button><button type="submit" class="btn">Adicionar</button></div>`;
  dform.onsubmit = ev => {
    ev.preventDefault();
    const fd = new FormData(dform), nome = String(fd.get('nome')).trim(); if (!nome) return;
    S.extras.push({ id:'x-'+Date.now().toString(36), setor:s.codigo, nome, subpasta:fd.get('subpasta'), obrigatorio:!!fd.get('obrigatorio'),
      validade_dias: fd.get('validade') ? Number(fd.get('validade')) : null, temporalidade:String(fd.get('temporalidade')||'').trim(), acesso:fd.get('acesso') });
    salvar(); dlg.close(); render(); toast('Documento adicionado.');
  };
  dlg.showModal();
}

/* ---------- exportações ---------- */
function baixar(nome, conteudo, tipo){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(conteudo instanceof Blob ? conteudo : new Blob([conteudo], {type:tipo}));
  a.download = nome; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}
function exportarBackup(){
  baixar(`${iso(hoje())}_BACKUP_Gestao-Documental_v01.json`, JSON.stringify({sistema:'gestao-documental', versao_estrutura:E.versao, exportado:new Date().toISOString(), dados:{...S, perfil:perfil()}}, null, 2), 'application/json');
  toast('Backup baixado. Ele também serve de perfil para o gerar.py.');
}
function importarBackup(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result); const d = j.dados || j;
      if (!d || typeof d.docs !== 'object') throw 0;
      if (!confirm('Substituir os dados atuais deste navegador pelo backup selecionado?')) return;
      S = Object.assign(vazio(), d); salvar(); render(); toast('Backup restaurado.');
    } catch(e){ toast('Arquivo inválido: não é um backup deste painel.'); }
  };
  r.readAsText(file);
}
function exportarCSV(){
  const cab = ['Setor','Pasta','Subpasta','Documento','Obrigatório','Validade','Emissão','Vencimento','Status','Responsável','Link','Prazo de guarda','Acesso','Base legal','Observações'];
  const q = v => `"${String(v??'').replace(/"/g,'""')}"`;
  const linhas = todosDocs().map(d => { const st=estado(d), v=vencimento(d);
    return [`${d.setor.codigo} ${d.setor.nome}`, d.setor.pasta, d.subpasta, d.nome, d.obrigatorio?'Sim':'Não', validadeTxt(d.validade_dias), fmt(parse(st.emissao)), fmt(v), status(d).t, st.responsavel, st.link, d.temporalidade, E.niveis_acesso[d.acesso]?.rotulo, d.base, st.obs].map(q).join(';'); });
  baixar(`${iso(hoje())}_RELATORIO_Controle-Documental_v01.csv`, '﻿'+[cab.map(q).join(';'),...linhas].join('\r\n'), 'text/csv;charset=utf-8');
  toast('Planilha baixada (abre no Excel e no Google Sheets).');
}

/* estrutura de pastas: espelha gestao-documental/gerar.py (mantenha idênticos) */
const orgTxt = p => ({mensal:' [organizar em AAAA/AAAA-MM]', anual:' [organizar em AAAA]'})[p.periodo] || '';
function leiaMeSetor(s, P){
  const n = E.niveis_acesso[s.acesso];
  const l = [`${s.pasta}: ${s.nome.toUpperCase()}`, '='.repeat(60), s.descricao, '', `Responsável: ${s.responsavel}`, `Acesso: ${n.rotulo}. ${n.descricao}`, '', 'SUBPASTAS', '-'.repeat(60)];
  s.subpastas.forEach(p => { if (aplica(p, P)) l.push(`  ${p.pasta}: ${p.descricao}${orgTxt(p)}`); });
  l.push('', 'DOCUMENTOS CONTROLADOS ([*] = obrigatório)', '-'.repeat(60));
  s.documentos.forEach(d => { if (!aplica(d, P)) return;
    l.push(`  ${d.obrigatorio?'[*]':'[ ]'} ${d.nome}`, `      pasta: ${d.subpasta} | ${validadeTxt(d.validade_dias).toLowerCase()} | guarda: ${d.temporalidade}`);
    if (d.base) l.push(`      base legal: ${d.base}`); if (d.nota) l.push(`      atenção: ${d.nota}`); });
  l.push('', 'Nomenclatura de arquivos: AAAA-MM-DD_TIPO_Descricao-curta_vNN.ext', 'Manual completo: _LEIA-ME.txt na raiz.');
  return l.join('\n') + '\n';
}
function leiaMeRaiz(P){
  const op = E.opcoes_perfil, raiz = slugRaiz(P.nome);
  const l = [`${raiz}: ESTRUTURA DE PASTAS (modelo v${E.versao})`, '='.repeat(60),
    `Empresa: ${P.nome}`, `Regime tributário: ${op.regime[P.regime]}`,
    `Atividades: ${P.atividades.map(a=>op.atividades[a]).join(', ') || '-'}`,
    `Possui empregados: ${P.empregados?'sim':'não'}`, '', 'REGRAS DE OURO',
    ' 1. Cada documento tem UM lugar. Não crie cópias em outras pastas: use atalho/link.',
    ' 2. Não crie pastas novas no 1º e 2º nível sem aprovação da Diretoria.',
    ' 3. Nome de arquivo: AAAA-MM-DD_TIPO_Descricao-curta_vNN.ext',
    '    Ex.: 2026-11-14_CONTRATO_Locacao-Sala-302_v01.pdf',
    "    Sem acentos, sem espaços, sem 'final', 'final2', 'novo'.",
    ' 4. Documentos fiscais e financeiros: pasta da COMPETÊNCIA (AAAA/AAAA-MM), não da data de pagamento.',
    ' 5. Nota fiscal: guarde sempre o XML. O PDF é só a representação.',
    ' 6. Versão assinada = PDF. Rascunho editável fica junto, com sufixo _RASCUNHO.',
    ' 7. Nada é apagado: documentos encerrados vão para 99_ARQUIVO_MORTO.',
    ' 8. Senhas e certificados digitais (.pfx) NUNCA ficam nestas pastas.', '', 'NÍVEIS DE ACESSO'];
  Object.values(E.niveis_acesso).forEach(n => l.push(`  ${n.rotulo}: ${n.descricao}`));
  l.push('', 'SETORES');
  E.setores.forEach(s => { if (setorAtivo(s, P)) l.push(`  ${s.pasta.padEnd(34)} ${s.nome} (${E.niveis_acesso[s.acesso].rotulo})`); });
  l.push('', `AVISO: ${E.aviso}`);
  return l.join('\n') + '\n';
}
function arvore(P=perfil(), ano=new Date().getFullYear(), comMeses){
  const meses = comMeses === undefined ? P.pastas_mensais : comMeses;
  const raiz = slugRaiz(P.nome);
  const it = [[raiz,null],[`${raiz}/_LEIA-ME.txt`, leiaMeRaiz(P)]];
  for (const s of E.setores){
    if (!setorAtivo(s, P)) continue;
    const b = `${raiz}/${s.pasta}`; it.push([b,null],[`${b}/_LEIA-ME.txt`, leiaMeSetor(s, P)]);
    for (const p of s.subpastas){
      if (!aplica(p, P)) continue;
      const sub = `${b}/${p.pasta}`; it.push([sub,null]);
      if (p.periodo){ it.push([`${sub}/${ano}`,null]);
        if (p.periodo==='mensal' && meses) for (let m=1;m<=12;m++) it.push([`${sub}/${ano}/${ano}-${String(m).padStart(2,'0')}`,null]); }
      if (p.modelo){ const m = E.modelos[p.modelo], mod = `${sub}/${m.pasta}`;
        it.push([mod,null],[`${mod}/_COMO-USAR.txt`, m.descricao+'\n']); m.subpastas.forEach(x => it.push([`${mod}/${x}`,null])); }
    }
  }
  return it;
}
function carregarJSZip(){
  if (window.JSZip) return Promise.resolve(window.JSZip);
  return new Promise((ok, erro) => { const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js'; s.onload = () => ok(window.JSZip); s.onerror = erro; document.head.appendChild(s); });
}
async function baixarZip(){
  toast('Gerando estrutura…');
  try {
    const JSZip = await carregarJSZip(), z = new JSZip(), P = perfil();
    for (const [p, c] of arvore(P)) c === null ? z.folder(p) : z.file(p, c);
    baixar(`${slugRaiz(P.nome)}.zip`, await z.generateAsync({type:'blob'}));
    toast('Estrutura baixada. Descompacte e arraste para o Drive.');
  } catch(e){ toast('Sem conexão para gerar o .zip. Use: python3 gestao-documental/gerar.py --zip'); }
}
function arvoreTexto(){
  return arvore(perfil(), new Date().getFullYear(), false).filter(([,c]) => c===null).map(([p]) => { const partes = p.split('/'); return '    '.repeat(partes.length-1) + partes.at(-1) + '/'; }).join('\n');
}

/* ---------- eventos ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-stop],[data-edit],[data-novo],[data-filtro],[data-go],[data-act],[data-copy],[data-fechar],[data-del],[data-limpar]');
  if (!t) return;
  if (t.hasAttribute('data-stop')) return;
  if (t.dataset.edit) return abrirDoc(t.dataset.edit);
  if (t.dataset.novo) return abrirNovo(t.dataset.novo);
  if (t.dataset.filtro){ filtro = t.dataset.filtro; return render(); }
  if (t.dataset.go){ location.hash = t.dataset.go; return; }
  if (t.dataset.copy) return copiar(document.getElementById(t.dataset.copy).textContent);
  if (t.hasAttribute('data-fechar')) return dlg.close();
  if (t.dataset.del){ if (confirm('Excluir este documento do controle?')){ S.extras = S.extras.filter(x=>x.id!==t.dataset.del); delete S.docs[t.dataset.del]; salvar(); dlg.close(); render(); } return; }
  if (t.dataset.limpar){ if (confirm('Apagar as datas, o responsável e o link deste documento?')){ delete S.docs[t.dataset.limpar]; salvar(); dlg.close(); render(); } return; }
  const a = t.dataset.act;
  if (a==='backup') exportarBackup();
  else if (a==='restore') $('#file').click();
  else if (a==='csv') exportarCSV();
  else if (a==='zip') baixarZip();
  else if (a==='copiar-arvore') copiar(arvoreTexto());
  else if (a==='perfil-padrao'){ if (confirm('Voltar ao perfil padrão?')){ S.perfil = null; salvar(); render(); } }
});
document.addEventListener('submit', ev => {
  if (ev.target.id !== 'perfil-form') return;
  ev.preventDefault();
  const P = lerPerfilForm();
  if (!P.atividades.length){ toast('Marque ao menos uma atividade.'); return; }
  S.perfil = P; salvar(); render(); toast('Perfil salvo. Estrutura e documentos ajustados.');
});
document.addEventListener('keydown', ev => { if (ev.key==='Enter' && ev.target.matches('.row[data-edit]')) abrirDoc(ev.target.dataset.edit); });
document.addEventListener('input', ev => {
  if (!ev.target.closest('#view')) return;
  const h = rota().h;
  if (h==='nomenclatura') atualizarGeradores();
  if (h==='perfil') atualizarResumoPerfil();
});
document.addEventListener('change', ev => { if (ev.target.closest('#perfil-form')) atualizarResumoPerfil(); });
dlg.addEventListener('click', ev => { if (ev.target === dlg) dlg.close(); });
$('#file').addEventListener('change', ev => { if (ev.target.files[0]) importarBackup(ev.target.files[0]); ev.target.value=''; });
let qT; $('#q').addEventListener('input', ev => { clearTimeout(qT); qT = setTimeout(() => { location.hash = 'busca?q=' + encodeURIComponent(ev.target.value); }, 200); });
$('#menu').addEventListener('click', () => document.body.classList.add('nav-open'));
$('#scrim').addEventListener('click', () => document.body.classList.remove('nav-open'));
function rodapeSalvo(){ $('#saved').textContent = S.atualizado ? `Salvo neste navegador em ${fmt(new Date(S.atualizado))}. Faça backup semanal.` : 'Os dados ficam salvos neste navegador. Faça backup semanal.'; }

rodapeSalvo();
render();
</script>
