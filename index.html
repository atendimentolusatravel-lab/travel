<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>LusaTravel Propostas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600;700&family=Montserrat:wght@500;600&display=swap">
<style>
:root{ --gold:#da8d00; --ink:#1a1510; --paper:#faf7f2; --char:#333131; }
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ --paper:#141109; --char:#d9cec1; --gold:#e8a210; } }
:root[data-theme="dark"]{ --paper:#141109; --char:#d9cec1; --gold:#e8a210; }
*{ box-sizing:border-box; margin:0; padding:0; }
body{ min-height:100vh; display:flex; flex-direction:column; background:var(--paper); color:var(--char); font-family:'Poppins',system-ui,sans-serif; }
header{ background:#1a1510; padding:56px 16px 44px; text-align:center; border-bottom:3px solid var(--gold); }
.logo{ font-family:'Montserrat',sans-serif; font-weight:600; font-size:14px; letter-spacing:.34em; text-transform:uppercase; color:var(--gold); }
h1{ margin-top:18px; font-weight:700; font-size:clamp(24px,5vw,36px); color:#fff; }
main{ flex:1; max-width:560px; margin:0 auto; padding:44px 16px; text-align:center; font-weight:300; line-height:1.7; }
main a{ color:inherit; text-decoration:none; border-bottom:1px solid var(--gold); }
p + p{ margin-top:14px; }
</style>
</head>
<body>
<header>
  <div class="logo">LusaTravel</div>
  <h1>Propostas de viagem</h1>
</header>
<main>
  <p>Cada proposta tem um endereço próprio, enviado diretamente ao cliente.</p>

</main>
</body>
</html>
