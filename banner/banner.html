<!doctype html>
<meta charset="utf-8">
<title>Banner Photocall — Lusa Travel</title>
<link rel="stylesheet" href="assets/fonts.css">
<style>
/* ── Formato: 1600 x 2000 mm (1,60 m x 2,00 m). 1px = 1mm ─────────────── */
:root{
  --verde:#444c2a;        /* fundo institucional Lusa Travel */
  --sage:#a6c9ae;         /* verde claro da marca sobre fundo escuro */
  --creme:#f2f0e7;        /* logotipos dos parceiros */
  --linha:rgba(242,240,231,.38);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#2a2a2a}
.banner{position:relative;width:1600px;height:2000px;overflow:hidden;
  background:var(--verde);font-family:'Jost',sans-serif;color:var(--creme)}

/* ── faixa superior: lockup principal ─────────────────────────────────── */
.topo{position:absolute;top:0;left:0;right:0;height:450px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-bottom:2px solid var(--linha)}
.topo .lockup{height:310px;display:block}

/* ── padrao step-and-repeat ───────────────────────────────────────────── */
.pattern{position:absolute;top:450px;left:0;right:0;bottom:0;overflow:hidden}
.prow{display:flex;align-items:center;justify-content:flex-start;gap:120px;
  height:258px;margin-left:-120px}
.prow.odd{margin-left:-370px}
.cell{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;
  justify-content:center;width:380px}

/* marca Lusa Travel repetida (lockup horizontal oficial) */
.lusa img{width:370px;display:block}

/* lockup Qoya */
.qoya .name{font-family:'Playfair Display',serif;font-weight:500;font-size:62px;
  line-height:.95;letter-spacing:.02em;color:var(--creme)}
.qoya .sub{font-family:'Poppins',sans-serif;font-weight:300;font-size:14px;
  letter-spacing:.5em;text-indent:.5em;color:var(--creme);margin-top:12px}
.qoya .bar{width:100%;height:2px;background:var(--creme);margin:16px 0 14px}
/* lockup Suryaa */
.suryaa img{height:76px;display:block;margin-bottom:12px}
.suryaa .name{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:58px;
  line-height:1;letter-spacing:.1em;text-indent:.1em;color:var(--creme)}
.suryaa .bar{width:100%;height:2px;background:var(--creme);margin:12px 0 14px}
/* bloco Curio Collection by Hilton */
.curio{font-family:'Poppins',sans-serif;font-weight:500;font-size:19px;
  letter-spacing:.16em;line-height:1.3;color:var(--creme);text-align:center}
.curio .hilton{font-family:'Playfair Display',serif;font-weight:400;font-size:25px;
  letter-spacing:.01em;margin-top:8px}
.curio .hilton sup{font-size:.4em;vertical-align:super}

/* ── cartao QR ────────────────────────────────────────────────────────── */
.qr{position:absolute;right:90px;bottom:100px;width:300px;
  background:#fff;border-radius:36px;padding:28px 28px 22px;
  display:flex;flex-direction:column;align-items:center;gap:16px}
.qr .code{position:relative;width:244px;height:244px}
.qr .code img{width:100%;height:100%;display:block}
.qr .ig{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  width:64px;height:64px;background:#fff;border-radius:12px;padding:6px}
.qr b{font-family:'Poppins',sans-serif;font-weight:600;font-size:33px;
  letter-spacing:.05em;color:var(--verde)}
</style>

<div class="banner">
  <div class="topo">
    <img class="lockup" src="assets/lusatravel-vertical-sage.png"
         alt="Lusa Travel — travel agency">
  </div>

  <div class="pattern" id="pattern"></div>

  <div class="qr">
    <div class="code">
      <img src="assets/qrcode-instagram.svg" alt="QR Instagram Lusa Travel">
      <svg class="ig" viewBox="0 0 100 100" fill="none" stroke="#1a1a18" stroke-width="9">
        <rect x="9" y="9" width="82" height="82" rx="26"/>
        <circle cx="50" cy="50" r="20"/>
        <circle cx="73.5" cy="26.5" r="3" fill="#1a1a18" stroke-width="6"/>
      </svg>
    </div>
    <b>@LUSATRAVEL</b>
  </div>
</div>

<script>
const lusa = `<div class="cell lusa">
    <img src="assets/lusatravel-horizontal-sage.png" alt="Lusa Travel">
  </div>`;
const qoya = `<div class="cell qoya">
    <div class="name">QOYA</div>
    <div class="sub">H—OTELS</div>
    <div class="bar"></div>
    <div class="curio">CURIO COLLECTION
      <div class="hilton">by Hilton<sup>&trade;</sup></div>
    </div>
  </div>`;
const suryaa = `<div class="cell suryaa">
    <img src="assets/suryaa-sun-creme.svg" alt="">
    <div class="name">SURYAA</div>
    <div class="bar"></div>
    <div class="curio">CURIO COLLECTION
      <div class="hilton">by Hilton<sup>&trade;</sup></div>
    </div>
  </div>`;
const seq = [qoya, lusa, suryaa, lusa];          // parceiro / marca / parceiro / marca
const rows = 6, perRow = 4;
document.getElementById('pattern').innerHTML =
  Array.from({length: rows}, (_, r) =>
    '<div class="prow' + (r % 2 ? ' odd' : '') + '">' +
    Array.from({length: perRow}, (_, i) => seq[(i + r * 2) % seq.length]).join('') +
    '</div>').join('');
</script>
