<style>
:root{
  --green:#404626; --green-dark:#363b1f; --green-soft:#5a6238;
  --sage:#d9ead3; --sage-head:#c6d8b0;
  --ink:#333131; --muted:#6f6f68; --line:#e7e7e0; --bg:#ffffff; --cream:#faf9f5;
  --terra:#b4622f;
  --shadow:0 10px 30px rgba(64,70,38,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased}
.page{max-width:1080px;margin:0 auto;background:var(--bg);box-shadow:0 0 60px rgba(0,0,0,.06)}
img{max-width:100%;display:block}
h1,h2,h3,h4{line-height:1.15}
.eyebrow{font-size:.72rem;letter-spacing:.32em;text-transform:uppercase;font-weight:600;color:var(--green-soft)}
.accent-line{width:64px;height:4px;background:var(--green);margin:14px 0 0;border-radius:2px}
.section{padding:60px 56px}
.section h2{font-size:2.1rem;font-weight:700;letter-spacing:-.01em}
.muted{color:var(--muted)}

.brandbar{display:flex;flex-direction:column;align-items:center;gap:8px;padding:38px 0 6px}
.brandbar .brandlogo{width:210px;height:auto;display:block}
.footlogo{width:190px;height:auto;display:block;margin-bottom:14px}

/* HERO */
.hero{padding:56px 56px 40px}
.hero .eyebrow{margin-bottom:14px}
.hero h1{font-size:3.1rem;font-weight:700;letter-spacing:-.02em;line-height:1.05}
.hero h1 .amp{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-style:italic}
.hero-sub{margin-top:8px;color:var(--muted);font-size:1.02rem}
.hero-img{margin:34px 0 0;height:330px;border-radius:14px;overflow:hidden;position:relative;
  display:flex;align-items:flex-end;box-shadow:var(--shadow);
  background:
    radial-gradient(120% 130% at 12% 8%, rgba(70,120,150,.55), rgba(40,80,110,.15) 42%, transparent 60%),
    radial-gradient(120% 130% at 92% 96%, rgba(150,170,120,.55), rgba(90,110,70,.2) 44%, transparent 64%),
    linear-gradient(120deg, #3a5f80 0%, #5a7d92 30%, #8aa0a2 55%, #b0a878 80%, #7a6a3a 100%);}
.hero-img img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0}
.hero-img::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
  background:linear-gradient(to top, rgba(20,26,32,.6), rgba(20,26,32,.05) 55%, transparent)}
.hero-img .cap{position:relative;z-index:2;padding:22px 26px;color:#fff}
.hero-img .cap .k{font-size:.68rem;letter-spacing:.28em;text-transform:uppercase;font-weight:600;opacity:.92}
.hero-img .cap .t{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.6rem;font-weight:600;line-height:1.15;text-shadow:0 1px 14px rgba(0,0,0,.35)}
.hero-info{display:grid;grid-template-columns:1fr auto;gap:24px;margin-top:34px;padding-top:26px;border-top:1px solid var(--line)}
.hero-info .lbl{font-size:.7rem;letter-spacing:.28em;text-transform:uppercase;font-weight:600;color:var(--green-soft);margin-bottom:6px}
.hero-info .r{text-align:right}
.hero-info p{font-size:.95rem}
.gloss{display:flex;flex-wrap:wrap;gap:14px;margin-top:34px}
.chip{display:flex;align-items:center;gap:10px;background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:.9rem;font-weight:500}
.chip b{font-size:1.15rem;font-weight:700}
.chip .ic{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:9px;background:var(--green);color:#fff}
.chip .ic svg{width:18px;height:18px}

/* AEREO */
.air{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:18px;background:#fff;box-shadow:var(--shadow)}
.air-head{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--green);color:#fff;padding:14px 22px}
.air-head .dir{font-weight:700;letter-spacing:.14em;font-size:.78rem;text-transform:uppercase}
.air-head .route{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.35rem;font-weight:600}
.leg{display:grid;grid-template-columns:200px 1fr auto;gap:18px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.leg .fl{font-size:.78rem;color:var(--muted)}
.leg .fl b{display:block;color:var(--ink);font-size:.92rem;font-weight:600}
.leg .rt{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.leg .pt .code{font-weight:700;font-size:1.05rem}
.leg .pt .tm{font-size:.82rem;color:var(--muted)}
.leg .arrow{color:var(--green-soft);flex:none}
.leg .cls{text-align:right;font-size:.78rem}
.leg .cls b{display:block;color:var(--green);font-size:.86rem}
.cnx{display:flex;align-items:center;gap:8px;padding:9px 22px;background:#f4f5ef;font-size:.75rem;color:var(--muted);border-bottom:1px solid var(--line)}
.cnx svg{width:14px;height:14px;flex:none;color:var(--green-soft)}
.air-foot{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 22px;background:#f4f5ef}
.air-foot .lbl{font-size:.78rem;color:var(--muted)}
.air-foot .val{font-weight:700;font-size:1.3rem;color:var(--green)}

/* HOTELS */
.city-block{margin-top:34px}
.city-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:6px;border-bottom:2px solid var(--green);padding-bottom:10px;margin-bottom:22px}
.city-head h3{font-size:1.4rem;font-weight:700}
.city-head .dates{color:var(--green-soft);font-weight:600;font-size:.9rem;letter-spacing:.04em}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.hgrid>.hotel{min-width:0}
@media(max-width:720px){.hgrid{grid-template-columns:1fr}}
.hotel{border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:var(--shadow);padding:20px 22px}
.hotel-top{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.hotel-name{font-size:1.06rem;font-weight:600;display:flex;align-items:center;gap:12px}
.hotel-name .bldg{width:34px;height:34px;flex:none;border:1.6px solid var(--ink);border-radius:50%;display:grid;place-items:center}
.hotel-name .bldg svg{width:17px;height:17px}
.hotel-price{text-align:right;flex:none}
.hotel-price .v{font-size:1.3rem;font-weight:700;color:var(--green);white-space:nowrap}
.hotel-price .u{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hotel-room{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:.86rem;color:var(--muted)}
.hotel-room b{color:var(--green-dark);font-weight:600}
.bf{display:inline-block;font-size:.6rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--green-soft);background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:3px 9px;margin-top:10px}
.hgal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;margin-top:14px}
.hgal img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:7px;display:block;background:#eceadf}

/* experience card */
.svc{display:grid;grid-template-columns:52px 1fr auto;gap:18px;align-items:start;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin-top:14px;background:#fff;box-shadow:var(--shadow)}
.svc .ic{width:52px;height:52px;background:var(--green);border-radius:12px;display:grid;place-items:center;color:#fff;flex:none}
.svc .ic svg{width:24px;height:24px}
.svc .t{font-weight:600;font-size:1.02rem}
.svc .d{color:var(--muted);font-size:.86rem;margin-top:2px}
.svc .dt{text-align:right;font-weight:700;font-size:.9rem;color:var(--green-soft);white-space:nowrap}
.dayrow{display:grid;grid-template-columns:92px 1fr;gap:22px;padding:22px 0;border-bottom:1px solid var(--line)}
.dayrow:last-of-type{border-bottom:none}
.daynum{text-align:right}
.daynum .d{font-family:'Cormorant Garamond',Georgia,serif;font-size:2rem;font-weight:700;color:var(--green);line-height:1}
.daynum .m{font-size:.66rem;letter-spacing:.2em;text-transform:uppercase;color:var(--green-soft);font-weight:700;margin-top:2px}
.daynum .w{font-size:.7rem;color:var(--muted);margin-top:2px}
.daybody .city{font-size:.62rem;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:#fff;background:var(--green);border-radius:12px;padding:3px 11px;display:inline-block;margin-bottom:9px}
.daybody h4{font-size:1.06rem;font-weight:600;margin-bottom:5px;color:var(--green-dark)}
.daybody p{font-size:.88rem;color:var(--muted)}
.daybody ul{margin:9px 0 0 18px;font-size:.88rem;color:var(--muted)}
.daybody li{margin:5px 0}
.tag-q,.tag-s{display:inline-block;font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:10px;padding:2px 8px;margin-left:5px;white-space:nowrap}
.tag-q{color:var(--terra);background:#fdf3ec;border:1px solid #f0dccd}
.tag-s{color:var(--green-dark);background:#eef2e6;border:1px solid #dde5cf}
@media(max-width:720px){.dayrow{grid-template-columns:64px 1fr;gap:14px}.daynum .d{font-size:1.5rem}}

.svc .d ul.incl{margin:8px 0 0 18px;padding:0}
.svc .d ul.incl li{margin:5px 0;font-size:.86rem;line-height:1.55}
.svc .d .fine{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:.78rem;line-height:1.55}
.svc .d .upg{margin-top:9px;background:var(--sage);border-radius:8px;padding:9px 12px;font-size:.8rem;color:var(--green-dark)}

.svc .d .sub{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.12rem;font-weight:600;color:var(--green-dark);margin:6px 0 8px;line-height:1.3}
.svc .d p{margin-bottom:8px;font-size:.86rem;line-height:1.6}


.svc .d .carimg{margin-top:12px;max-width:320px}
.svc .d .carimg img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:10px;display:block;background:#eceadf}

.subh{font-size:1.15rem;font-weight:700;color:var(--green-dark);margin:30px 0 4px}
.shipbox{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:22px 26px;margin-top:20px}
.shipbox .shipname{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.8rem;font-weight:700;color:var(--green-dark)}
.shipstats{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.shipstats div{text-align:center}
.shipstats b{display:block;font-size:1.15rem;font-weight:700;color:var(--green)}
.shipstats span{display:block;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:2px}
.cabgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:18px}
.cab{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:var(--shadow)}
.cabhd{background:var(--green);color:#fff;padding:16px 22px}
.cabcat{font-size:.64rem;letter-spacing:.22em;text-transform:uppercase;font-weight:600;opacity:.8}
.cabname{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.5rem;font-weight:700;margin-top:2px}
.shipgal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.shipgal img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;display:block;background:#eceadf}
.cabimg img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;background:#eceadf}
@media(max-width:720px){.shipgal{grid-template-columns:1fr}}

.cabbody{padding:20px 22px}
.cabprice .v{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:700;color:var(--green-dark);line-height:1}
.cabprice .u{font-size:.76rem;color:var(--muted);margin-top:3px}
.cabinc{margin:14px 0 0 18px;font-size:.86rem;color:var(--muted)}
.cabinc li{margin:5px 0}
@media(max-width:720px){.shipstats{grid-template-columns:repeat(3,1fr)}.cabgrid{grid-template-columns:1fr}}
.pkg-note{background:var(--sage);border-radius:10px;padding:14px 18px;margin-top:16px;font-size:.9rem;color:var(--green-dark)}

/* TABLE */
.tbl-wrap{overflow-x:auto;margin-top:24px;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:.88rem;min-width:560px}
th,td{text-align:left;padding:11px 16px;border-bottom:1px solid var(--line)}
.sec-row td{background:var(--sage);font-weight:700;text-align:center;letter-spacing:.04em;color:var(--green-dark)}
.head-row td{background:#efeee7;font-weight:600;color:#4a4a44}
.total-row td{background:#eef2e6;font-weight:700}
td.v{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.note{font-size:.82rem;color:var(--muted);margin-top:12px}

/* PAY */
.pay{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
.pay .box{background:var(--cream);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.pay h4{font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;color:var(--green-soft);margin-bottom:10px}
.pay p{font-size:.9rem;margin-bottom:4px}
.obs{margin-top:26px;font-size:.82rem;color:var(--muted)}
.obs li{margin:6px 0 6px 18px}
.obs h4{color:var(--ink);font-size:.9rem;margin:14px 0 6px}
.flval{display:flex;justify-content:space-between;align-items:center;background:var(--green);color:#fff;border-radius:12px;padding:16px 24px;margin-top:16px;flex-wrap:wrap;gap:12px}
.flval .lbl{font-weight:600;font-size:.9rem}
.flval .amt{text-align:right}
.flval .amt .t{font-family:'Cormorant Garamond',serif;font-size:1.7rem;font-weight:700;line-height:1}
.flval .amt .p{font-size:.74rem;opacity:.9;margin-top:3px}

/* FOOTER */
.footer{background:var(--green);color:#fff;padding:44px 56px}
.footer .contact{margin-top:4px;font-size:.86rem;opacity:.9;line-height:1.9}
.footer .fnote{font-size:.8rem;opacity:.7;margin-top:16px}
.sh .eyebrow{margin-bottom:10px;display:block}

/* ---------- COMPONENTES OPCIONAIS (herdados da cotação Canadá & NY) ---------- */
/* Timeline-resumo do roteiro (1 linha por cidade) */
.tl{margin-top:34px;border-left:2px solid var(--line);padding-left:0}
.tl-item{display:grid;grid-template-columns:56px 1fr auto;gap:20px;padding:22px 0 22px 26px;position:relative;border-bottom:1px solid var(--line)}
.tl-item:last-child{border-bottom:none}
.tl-num{width:40px;height:40px;background:var(--green);color:#fff;border-radius:9px;display:grid;place-items:center;font-weight:700;font-size:1.05rem;margin-left:-27px}
.tl-city{font-weight:600;font-size:1.12rem}
.tl-country{color:var(--muted);font-size:.9rem}
.tl-meta{color:var(--muted);font-size:.9rem;margin-top:4px}
.tl-nights{text-align:right;font-weight:700;font-size:1.4rem;line-height:1}
.tl-nights span{display:block;font-size:.72rem;font-weight:500;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-top:2px}

/* Cabeçalho de opção dentro de uma seção (ex.: 2 blocos de aéreo) */
.opt-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:26px;margin-bottom:2px}
.opt-head h3{font-size:1.25rem;font-weight:700}
.opt-head .badge{font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;background:var(--sage);color:var(--green-dark);padding:5px 12px;border-radius:20px}

/* Etiqueta de rede/bandeira ao lado do nome do hotel */
.opt-tag{display:inline-block;font-size:.62rem;letter-spacing:.12em;text-transform:uppercase;font-weight:600;padding:4px 9px;border-radius:20px;margin-left:2px;vertical-align:middle;background:#efe7d6;color:#8a6d2f}

/* Hotel com mais de uma tarifa: linhas .rate dentro do card */
.rate{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line);margin-top:10px}
.rate .rt{font-size:.88rem}
.rate .rt b{font-weight:600;color:var(--green-dark)}
.rate .rv{font-weight:700;font-size:1rem;color:var(--green);white-space:nowrap}

/* Aviso âmbar (ex.: item fora da cotação) */
.flag-note{background:#fbf3e6;border:1px solid #e9d7b3;border-left:4px solid #c9a227;border-radius:8px;padding:12px 16px;margin-top:14px;font-size:.85rem;color:#6b5a2e}

/* Destaque verde dentro de um dia do roteiro (data especial, aviso) */
.daybody .hl{background:var(--sage);border-radius:9px;padding:10px 13px;margin-top:10px;font-size:.85rem;color:var(--green-dark)}

/* Localidade do hotel na tabela de valores (usado nas cotações, faltava no CSS) */
.rm{font-size:.78rem;color:var(--muted);font-weight:400;margin-top:2px}

/* Fallback de marca em texto, quando img/logo-*.png não existir */
.brandtext{font-family:'Cormorant Garamond',Georgia,serif;font-size:1.9rem;font-weight:700;letter-spacing:.3em;color:var(--green);text-transform:uppercase}
.footer .brandtext{color:#fff;margin-bottom:14px}

@media(max-width:720px){
  .section,.hero,.footer,.brandbar{padding-left:24px;padding-right:24px}
  .hero h1{font-size:2.2rem}
  .hero-info{grid-template-columns:1fr}.hero-info .r{text-align:left}
  .leg{grid-template-columns:1fr;gap:8px}
  .air-head{flex-direction:column;align-items:flex-start;gap:2px}
  .pay{grid-template-columns:1fr}
  .svc{grid-template-columns:1fr;text-align:left}.svc .dt{text-align:left}
  .tl-item{grid-template-columns:40px 1fr auto;gap:12px}
  .hotel-top{flex-direction:column}.hotel-price{text-align:left}
}
</style>
